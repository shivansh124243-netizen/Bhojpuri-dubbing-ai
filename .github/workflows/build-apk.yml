name: Build BhojpuriDubbingAI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "BhojpuriDubbingAI_V14_APK_READY_SOURCE.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source ZIP
        run: |
          unzip -q -o BhojpuriDubbingAI_V14_APK_READY_SOURCE.zip
          test -d BhojpuriDubbingAI/android
          test -f BhojpuriDubbingAI/android/app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: BhojpuriDubbingAI/android
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          test -s BhojpuriDubbingAI/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BhojpuriDubbingAI-debug-APK
          path: BhojpuriDubbingAI/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
